<!doctype html>
<!--
  Social preview card for the site (public/og.jpg).
  Open this file in a browser with the window at 1200×630 and screenshot it,
  or render it headlessly. Fonts load from node_modules, so run `npm install`
  first — nothing is fetched from the internet.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="brand.css" />
    <style>
      body { width: 1200px; height: 630px; }
      .wrap { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 440px; align-items: center; padding: 0 90px; }
      .eyebrow { margin-bottom: 26px; }
      .name { font-size: 210px; }
      .line { margin-top: 22px; font-size: 40px; max-width: 16ch; }
      .tags { margin-top: 34px; }
      .emblem { justify-self: end; }
    </style>
  </head>
  <body>
    <div class="sky"></div>
    <div id="stars"></div>
    <div class="planet"></div>
    <div class="vig"></div>
    <div class="wrap">
      <div>
        <div class="eyebrow"><i></i>Digital World</div>
        <div class="name">AJ</div>
        <div class="line">“Welcome to my little corner of the internet.”</div>
        <div class="tags"><span>Technology</span><b></b><span>Networks</span><b></b><span>Security</span><b></b><span>AI</span></div>
      </div>
      <div class="emblem" style="width: 380px; height: 380px"></div>
    </div>
    <script src="brand.js"></script>
  </body>
</html>
