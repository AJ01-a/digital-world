<!doctype html>
<!--
  Square share image (share/enter-my-little-world.jpg) — for posting the link.
  Open at 1080×1080 and screenshot, or render headlessly. Fonts load from
  node_modules; nothing is fetched from the internet.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="brand.css" />
    <style>
      body { width: 1080px; height: 1080px; }
      .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 120px; }
      .eyebrow { margin-top: 44px; }
      .line { margin-top: 26px; font-size: 92px; line-height: 1.04; max-width: 12ch; color: #eef3ff; }
      .rule { width: 340px; height: 1px; margin: 40px 0 30px; background: linear-gradient(90deg, transparent, rgba(143, 230, 255, 0.7), transparent); }
      .url { font-family: "Geist Mono"; font-size: 21px; letter-spacing: 0.2em; color: #a9b8dc; }
    </style>
  </head>
  <body>
    <div class="sky"></div>
    <div id="stars"></div>
    <div class="planet"></div>
    <div class="vig"></div>
    <div class="wrap">
      <div class="emblem" style="width: 330px; height: 330px"></div>
      <div class="eyebrow"><i></i>AJ · Digital World</div>
      <div class="line">enter my little world…</div>
      <div class="rule"></div>
      <div class="url">aj01-a.github.io/digital-world</div>
    </div>
    <script src="brand.js"></script>
  </body>
</html>
