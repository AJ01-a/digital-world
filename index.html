<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AJ — Digital World</title>
    <meta name="description" content="AJ's digital world — technology, networks, security and AI, explored with curiosity. Plus games, chess, long drives, and Clover, the site's guide." />
    <meta name="author" content="AJ" />
    <meta name="theme-color" content="#040405" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!--
      The intro's two portraits, fetched alongside the app instead of after it —
      only when the intro will play (the same check as src/lib/intro.ts), at the
      same sizes the <img> uses (PORTRAIT_SIZES in src/lib/duality.ts).
    -->
    <script>
      try {
        if (!location.hash && !sessionStorage.getItem('aj:intro-seen')) {
          for (const name of ['white', 'red']) {
            const link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'image';
            link.type = 'image/avif';
            link.fetchPriority = 'high';
            link.setAttribute('imagesrcset', [640, 960, 1312].map((w) => './intro/' + name + '-' + w + '.avif ' + w + 'w').join(', '));
            link.setAttribute('imagesizes', '(max-aspect-ratio: 9/10) min(116vw, 56.3vh), min(105vh, 59.1vw)');
            document.head.appendChild(link);
          }
        }
      } catch {
        /* storage blocked: the images load with the intro instead */
      }
    </script>

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AJ — Digital World" />
    <meta property="og:title" content="AJ — Digital World" />
    <meta property="og:description" content="Technology, networks, security and AI — explored with curiosity. Come in; Clover will show you around." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The AJ monogram inside an octagonal frame, with the words Digital World" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AJ — Digital World" />
    <meta name="twitter:description" content="Technology, networks, security and AI — explored with curiosity. Come in; Clover will show you around." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "AJ — Digital World",
        "url": "%VITE_SITE_URL%/",
        "author": { "@type": "Person", "name": "AJ" }
      }
    </script>

    <style>
      /* Painted before any script runs, so there is never a white flash. */
      html, body { background: #040405; color: #eef0f4; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:40rem;margin:0 auto;padding:4rem 1.5rem;font-family:system-ui,sans-serif;line-height:1.7;color:#dfe6f7">
        <h1 style="font-weight:300;font-size:3rem;margin:0">AJ</h1>
        <p style="font-style:italic;color:#9fb2d8">Welcome to my little corner of the internet.</p>
        <p>
          I'm AJ — curious about how technology works underneath: Linux, networking, cybersecurity, systems and AI.
          Outside of that it's story-driven games, chess, long drives and walks with my dog, Clover.
        </p>
        <p style="color:#9fb2d8">
          This site is an interactive experience built with JavaScript. Turn it on to explore the chapters, the games and
          Clover, the site's guide.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
